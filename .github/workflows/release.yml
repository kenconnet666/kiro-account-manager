name: Release Windows

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  release-windows:
    name: Build and publish Windows x64
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          shared-key: release-windows-x64

      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag and source versions
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoMetadata = cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 | ConvertFrom-Json
          $cargoVersion = ($cargoMetadata.packages | Where-Object name -eq 'kiro-account-manager').version
          if ($packageVersion -ne $tagVersion -or $tauriVersion -ne $tagVersion -or $cargoVersion -ne $tagVersion) {
            throw "Version mismatch: tag=$tagVersion package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion"
          }

      - name: Build installers and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Kiro Account Manager v__VERSION__ (Lionheart)'
          releaseBody: |
            ## 本版本变更

            - 重构核心模块结构：优化会话管理、命令处理、存储机制、模型锁与托盘行为等模块
            - 调整构建配置与数据模型结构，功能保持兼容
            - 继承 v1.9.5：网关 API Key 名称前缀剥离、GET /models 兼容路由（CC Switch 支持）

            此版本由 kenconnet666 的 fork 通过 GitHub Actions 构建。
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc --bundles msi,nsis

      - name: Verify published installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = gh release view $env:GITHUB_REF_NAME --json assets --jq '.assets[].name'
          $hasMsi = $assets | Where-Object { $_ -match '\.msi$' }
          $hasExe = $assets | Where-Object { $_ -match '\.exe$' }
          if (!$hasMsi -or !$hasExe) {
            throw "Release is missing MSI or NSIS installer. Assets: $($assets -join ', ')"
          }
